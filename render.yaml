# Render blueprint: Render dashboard → New → Blueprint → pick this repo → Apply.
# Two services from one repo. If Render gives different URLs, update ALLOWED_ORIGINS and
# VITE_API_URL below (or in the dashboard) and redeploy.
services:
  # FastAPI + DuckDB. Free plan sleeps after 15 min idle; .github/workflows/keepwarm.yml pings it.
  - type: web
    name: fire-calendar-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Read-only public API, so any origin may call it (Render added a suffix to the site URL).
      - key: ALLOWED_ORIGINS
        value: "*"

  # React build served from Render's CDN. Static sites never sleep.
  - type: web
    name: fire-calendar
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://fire-calendar-api-x1ip.onrender.com
      - key: VITE_USE_MOCKS
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
